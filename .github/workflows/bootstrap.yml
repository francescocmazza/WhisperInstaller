name: Bootstrap repository

on:
  push:
    branches: [main]
    paths:
      - ".bootstrap/**"

permissions:
  contents: write

jobs:
  expand:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct and verify source archive
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/part-*.b64 | base64 -d > /tmp/whisper-installer.zip
          echo "3547373eea285bce428471be41e495879e1f2ce7d09d9f626d86a6b4bd18cc4c  /tmp/whisper-installer.zip" | sha256sum -c -

      - name: Expand definitive repository contents
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/whisper-installer-unpacked
          mkdir -p /tmp/whisper-installer-unpacked
          unzip -q /tmp/whisper-installer.zip -d /tmp/whisper-installer-unpacked
          cp -a /tmp/whisper-installer-unpacked/. .
          rm -rf .bootstrap
          rm -f .github/workflows/bootstrap.yml

      - name: Commit definitive source and installer
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Populate source and definitive Whisper installer"
          git push
