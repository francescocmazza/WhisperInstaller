name: Build Windows installer

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Scan repository for obvious secrets/personal paths
        run: python scripts/check_secrets.py

      - name: Validate Python sources
        run: python -m py_compile config/configure.py scripts/preflight.py scripts/check_secrets.py scripts/build_standalone.py scripts/launch_with_binding.py

      - name: Validate captured OEM hotkey syntax
        run: python -c "from config.configure import normalize_hotkey; assert normalize_hotkey('alt+226') == 'alt+226'; assert normalize_hotkey('ctrl+alt+0xe2') == 'ctrl+alt+0xe2'; print('OEM hotkey parser OK')"

      - name: Exercise private Python bootstrap
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $pyVersion = "3.12.10"
          $installer = Join-Path $env:RUNNER_TEMP "python-$pyVersion-amd64.exe"
          $target = Join-Path $env:RUNNER_TEMP "WhisperPrivatePython312"
          Invoke-WebRequest -Uri "https://www.python.org/ftp/python/$pyVersion/python-$pyVersion-amd64.exe" -OutFile $installer -UseBasicParsing
          Remove-Item $target -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $target | Out-Null
          $bootstrapArgs = @(
            "/quiet",
            "InstallAllUsers=0",
            "TargetDir=$target",
            "Include_exe=1",
            "Include_lib=1",
            "Include_dev=1",
            "Include_pip=1",
            "Include_tcltk=1",
            "Include_tools=1",
            "Include_launcher=0",
            "InstallLauncherAllUsers=0",
            "Include_test=0",
            "Include_doc=0",
            "AssociateFiles=0",
            "Shortcuts=0",
            "PrependPath=0"
          )
          & $installer @bootstrapArgs
          if ($LASTEXITCODE -ne 0) { throw "Python bootstrap exit code $LASTEXITCODE" }
          $python = Join-Path $target "python.exe"
          $pythonw = Join-Path $target "pythonw.exe"
          if (!(Test-Path $python) -or !(Test-Path $pythonw)) { throw "Private Python runtime incomplete" }
          & $python --version
          Remove-Item $target -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item $installer -Force -ErrorAction SilentlyContinue

      - name: Exercise Windows physical-key hook start/stop
        run: python scripts/launch_with_binding.py --selftest-hook

      - name: Generate definitive standalone PowerShell installer
        run: python scripts/build_standalone.py

      - name: Commit generated standalone installer if changed
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: powershell
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Whisper-Seamless-Installer-1.3.3.ps1 Whisper-Seamless-Installer-1.3.3.ps1.sha256.txt
          Get-ChildItem "Whisper-Seamless-Installer-*.ps1*" |
            Where-Object { $_.Name -notlike "Whisper-Seamless-Installer-1.3.3.ps1*" } |
            ForEach-Object { git rm -f $_.FullName }
          if (git diff --cached --quiet) {
            Write-Host "Standalone installer already up to date."
          } else {
            git commit -m "Build definitive standalone installer v1.3.3"
            git push
          }

      - name: Install Inno Setup
        shell: powershell
        run: choco install innosetup --no-progress -y

      - name: Build EXE installer
        shell: powershell
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" ".\installer\WhisperSeamless.iss"

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: Whisper-Seamless-Setup
          path: installer/Output/Whisper-Seamless-Setup-1.3.3.exe
          if-no-files-found: error

      - name: Publish definitive v1.3.3 release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v1.3.3"
          $exe = "installer/Output/Whisper-Seamless-Setup-1.3.3.exe"
          $head = (git rev-parse HEAD).Trim()

          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept = "application/vnd.github+json"
            "X-GitHub-Api-Version" = "2022-11-28"
          }
          $releaseExists = $false
          try {
            Invoke-RestMethod -Headers $headers -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/releases/tags/$tag" -Method Get | Out-Null
            $releaseExists = $true
          } catch {
            if ($_.Exception.Response.StatusCode.value__ -ne 404) {
              throw
            }
          }

          if ($releaseExists) {
            gh release upload $tag $exe --clobber
          } else {
            gh release create $tag $exe --target $head --title "Whisper Seamless v1.3.3" --notes "Runs the private Python bootstrap directly instead of through Start-Process, writes a dedicated Python installer log, verifies python.exe/pythonw.exe, and adds a real Windows CI bootstrap test."
          }
