name: Build Windows installer

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Scan repository for obvious secrets/personal paths
        run: python scripts/check_secrets.py

      - name: Validate Python sources
        run: python -m py_compile config/configure.py scripts/preflight.py scripts/check_secrets.py scripts/build_standalone.py scripts/launch_with_binding.py

      - name: Import Windows physical-key hook module
        run: python -c "import scripts.launch_with_binding; print('physical-key hook import OK')"

      - name: Generate definitive standalone PowerShell installer
        run: python scripts/build_standalone.py

      - name: Commit generated standalone installer if changed
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: powershell
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Whisper-Seamless-Installer-1.2.0.ps1 Whisper-Seamless-Installer-1.2.0.ps1.sha256.txt
          Get-ChildItem "Whisper-Seamless-Installer-*.ps1*" |
            Where-Object { $_.Name -notlike "Whisper-Seamless-Installer-1.2.0.ps1*" } |
            ForEach-Object { git rm -f $_.FullName }
          if (git diff --cached --quiet) {
            Write-Host "Standalone installer already up to date."
          } else {
            git commit -m "Build definitive standalone installer v1.2.0"
            git push
          }

      - name: Install Inno Setup
        shell: powershell
        run: choco install innosetup --no-progress -y

      - name: Build EXE installer
        shell: powershell
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" ".\installer\WhisperSeamless.iss"

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: Whisper-Seamless-Setup
          path: installer/Output/Whisper-Seamless-Setup-1.2.0.exe
          if-no-files-found: error

      - name: Publish definitive v1.2.0 release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v1.2.0"
          $exe = "installer/Output/Whisper-Seamless-Setup-1.2.0.exe"
          $head = (git rev-parse HEAD).Trim()

          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept = "application/vnd.github+json"
            "X-GitHub-Api-Version" = "2022-11-28"
          }
          $releaseExists = $false
          try {
            Invoke-RestMethod -Headers $headers -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/releases/tags/$tag" -Method Get | Out-Null
            $releaseExists = $true
          } catch {
            if ($_.Exception.Response.StatusCode.value__ -ne 404) {
              throw
            }
          }

          if ($releaseExists) {
            gh release upload $tag $exe --clobber
          } else {
            gh release create $tag $exe --target $head --title "Whisper Seamless v1.2.0" --notes "Adds press-a-key capture, reversible physical-key interception (including the Windows Menu/Context Menu key), automatic restoration of the key's original behavior when Whisper exits or is uninstalled, plus configurable autostart."
          }
